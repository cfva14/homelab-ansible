- name: Homelab status
  hosts: servers
  gather_facts: true
  become: true

  tasks:
    - name: Show hostname
      ansible.builtin.debug:
        msg: "Host: {{ ansible_hostname }}"

    - name: Show uptime
      ansible.builtin.command: uptime -p
      register: uptime_result
      changed_when: false

    - name: Print uptime
      ansible.builtin.debug:
        var: uptime_result.stdout

    - name: Show root disk usage
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Print disk usage
      ansible.builtin.debug:
        var: disk_result.stdout_lines

    - name: Show memory usage
      ansible.builtin.command: free -h
      register: memory_result
      changed_when: false

    - name: Print memory usage
      ansible.builtin.debug:
        var: memory_result.stdout_lines

    - name: Count pending package updates
      ansible.builtin.shell: |
        apt list --upgradable 2>/dev/null | tail -n +2 | wc -l
      register: updates_result
      changed_when: false

    - name: Print pending updates
      ansible.builtin.debug:
        msg: "Pending package updates: {{ updates_result.stdout }}"

    - name: Check whether Docker exists
      ansible.builtin.command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Show Docker containers
      ansible.builtin.command: docker ps --format "{{ '{{' }}.Names{{ '}}' }} - {{ '{{' }}.Status{{ '}}' }}"
      register: docker_result
      changed_when: false
      when: docker_check.rc == 0

    - name: Print Docker containers
      ansible.builtin.debug:
        var: docker_result.stdout_lines
      when: docker_check.rc == 0